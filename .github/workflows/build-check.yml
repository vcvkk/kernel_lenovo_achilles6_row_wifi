name: Build check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu flex bison bc libssl-dev device-tree-compiler

      - name: Generate defconfig
        run: |
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- achilles6_row_wifi_defconfig

      - name: Build Image.gz-dtb
        run: |
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- HOSTCFLAGS=-fcommon -j"$(nproc)" Image.gz-dtb

      - name: Verify artifact exists
        run: test -s out/arch/arm64/boot/Image.gz-dtb
